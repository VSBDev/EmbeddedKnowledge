  <title>Titration curve of a weak acid, showing the buffering region</title>
  <desc>pH on the vertical axis against volume of added strong base on the horizontal axis. The curve climbs steeply at first, then flattens into a plateau centred on the pKa, which is marked by a horizontal dotted line, before climbing steeply again. A box drawn around the plateau is labelled buffering region: across it, added strong base changes the pH only slightly.</desc>

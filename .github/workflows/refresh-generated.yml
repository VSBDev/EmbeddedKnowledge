name: refresh-generated

# The corpus-wide generated files — the lesson indexes, the progress ledgers, the terminology
# ledgers, the course landing-page counters, and the full agent context — depend on every published
# lesson, not on any one of them.
#
# Requiring each lesson pull request to carry them made every merge invalidate every other open
# request: nine open lessons meant nine re-syncs and nine more CI runs for every single merge, so
# the cost of landing a block grew with the square of its size. Branches spent longer being
# reconciled than reviewed.
#
# They are refreshed here instead, once, after the merge that changed the corpus. A lesson pull
# request now owns only the output derived from itself, so lessons merge in any order without
# conflicting with each other.

on:
  push:
    branches: [main]
    paths:
      - "lessons/**"
      - "scripts/**"
      - "course/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Two merges in quick succession must not race to write the same files.
  group: refresh-generated
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Rebuild generated output from the merged corpus
        run: npm run graph:build && npm run site:build
      - name: Commit any drift
        run: |
          if git diff --quiet -- site/; then
            echo "Generated output already matches the corpus; nothing to refresh."
            exit 0
          fi
          echo "Refreshing generated output after a corpus change:"
          git diff --name-only -- site/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/
          git commit -m "Refresh generated output after a corpus change

The lesson indexes, progress and terminology ledgers, landing-page counters, and
agent context are derived from every published lesson, so they are rebuilt on
main after a merge rather than carried by each lesson pull request."
          git push

name: validate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  # A structured review or adjudication submission is evidence this gate reads, but posting one
  # is a pull_request_review event. Without this trigger the gate keeps reporting the state it
  # saw before the artifact was submitted, and a maintainer sees a stale red check.
  pull_request_review:
    types: [submitted, dismissed]
  # Lets a maintainer re-run the required context without an empty commit or a draft toggle.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  # Writing a label on a pull request needs pull-requests: write. issues: write alone returns 403,
  # which is what the first attempt at narrowing this discovered.
  #
  # Merge authority is protected by contents: read above, not by withholding this scope: completing
  # a merge writes a commit to the base branch, which contents: read forbids. No workflow here can
  # merge, and the labeller additionally degrades to a log line rather than failing a required check
  # if it cannot write.
  pull-requests: write
  issues: write

jobs:
  agent-protocol:
    name: ${{ github.event.pull_request.draft && 'lesson-candidate' || 'agent-protocol' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Rebuild all generated output from source
        run: npm run graph:build && npm run site:build
      - name: Verify committed generated output matches a fresh build
        run: |
          # The corpus-wide aggregates depend on every published lesson, so requiring each lesson
          # pull request to carry them made every merge invalidate every other open request: the
          # cost of merging n lessons grew with n squared, and the branches spent longer being
          # re-synced than reviewed. They are refreshed on main by refresh-generated.yml instead,
          # and are excluded here so a lesson only owns the output derived from itself.
          AGGREGATES=(
            ':!site/data/premed-lessons.json'
            ':!site/data/psychiatry-lessons.json'
            ':!site/data/premed-progress.json'
            ':!site/data/psychiatry-progress.json'
            ':!site/data/premed-terminology.json'
            ':!site/data/psychiatry-terminology.json'
            ':!site/premed/index.html'
            ':!site/psychiatry/index.html'
            ':!site/llms-full.txt'
          )
          if [ "${{ github.event_name }}" = "push" ]; then
            TARGET=(site/)
          else
            TARGET=(site/ "${AGGREGATES[@]}")
          fi
          if ! git diff --exit-code -- "${TARGET[@]}"; then
            echo "::error::Committed generated files under site/ do not match a fresh build."
            echo "The files above were committed by hand or are stale. Run:"
            echo "  npm run graph:build && npm run site:build"
            echo "locally and commit the resulting site/ changes."
            exit 1
          fi
      - run: npm run validate
      - name: Verify structured review provenance
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        run: node scripts/validate-pr-review-provenance.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify lesson candidate or merge readiness
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        run: node scripts/validate-lesson-pr.mjs
      - name: Prove every incorporated repair actually changed a file
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        run: node scripts/validate-adjudication-dispositions.mjs
      - name: Refuse a discarded review record with no recorded decision
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        run: node scripts/validate-review-generations.mjs
      - name: Prove a rephrasing-tier change is wording-only
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        run: node scripts/validate-rephrasing-pr.mjs
      - name: Label the lesson pull request with its governance stage
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        run: node scripts/label-lesson-pr.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm test
